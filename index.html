<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0708" />
    <title>Το σπίτι της γριάς</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="fog" aria-hidden="true"></div>

    <section id="gate" class="gate">
      <h1 id="gate-title" class="title"></h1>
      <button id="enter" class="enter" type="button"></button>
      <p id="gate-hint" class="hint"></p>
    </section>

    <main id="hunt" class="hunt" hidden>
      <article id="card" class="card">
        <p id="card-badge" class="badge" hidden></p>
        <h1 id="card-title" class="title"></h1>
        <p id="card-text" class="card-text"></p>
      </article>
      <!-- After the last code: only this, on every phone. -->
      <section id="done" class="done" hidden>
        <p id="code-label" class="code-label"></p>
        <p id="code-word" class="code-word"></p>
      </section>
      <section id="progress" class="progress" aria-live="polite"></section>
      <button id="scan" class="scan-btn" type="button" hidden></button>
    </main>

    <script type="module" src="/src/player/main.ts"></script>
  </body>
</html>
