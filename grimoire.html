<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0708" />
    <title>Grimoire</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📕</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin">
    <form id="pin-form" class="pin" hidden>
      <h1 class="title">Grimoire</h1>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" />
      <button type="submit">Άνοιξε</button>
      <p id="pin-error" class="error" hidden>Λάθος PIN</p>
    </form>

    <main id="panel" class="panel" hidden>
      <header class="panel-head">
        <h1 class="title">Grimoire</h1>
        <span id="mode" class="mode"></span>
      </header>

      <section>
        <h2>Ονόματα</h2>
        <p class="note">Διάλεξε όνομα (προαιρετικά) και μετά πάτα ήχο.</p>
        <div id="names" class="chips"></div>
        <form id="name-form" class="row">
          <input id="name-input" placeholder="Νέο όνομα" maxlength="24" />
          <button type="submit">+</button>
        </form>
      </section>

      <section>
        <h2>Soundboard</h2>
        <div class="board">
          <button class="fx-btn scream" data-kind="scream">😱<span>Κραυγή</span></button>
          <button class="fx-btn thunder" data-kind="thunder">⚡<span>Κεραυνός</span></button>
          <button class="fx-btn laugh" data-kind="laugh">🧙‍♀️<span>Γέλιο</span></button>
        </div>
        <form id="msg-form" class="row">
          <input id="msg-input" placeholder="Μήνυμα σε όλους…" maxlength="120" />
          <button type="submit" name="kind" value="message" title="Εμφάνιση στην οθόνη">Στείλε</button>
          <button type="submit" name="kind" value="speak" title="Η γιαγιά το λέει φωναχτά">🗣️ Μίλα</button>
        </form>
        <label class="note"><input id="preview" type="checkbox" /> Παίξε και σε αυτό το κινητό</label>
        <p id="sent" class="note" aria-live="polite"></p>
      </section>

      <section>
        <details>
          <summary><h2>🧙‍♀️ Φωνή γιαγιάς (ElevenLabs)</h2></summary>
          <form id="voice-form" class="voice-form">
            <input id="voice-key" type="password" autocomplete="off" placeholder="API key" />
            <input id="voice-id" autocomplete="off" placeholder="Voice ID" />
            <select id="voice-model"></select>
            <button type="submit">Αποθήκευση &amp; δοκιμή</button>
          </form>
          <p class="note">Το κλειδί μένει μόνο σε αυτό το κινητό.</p>
        </details>
        <p id="voice-status" class="note" aria-live="polite"></p>
      </section>

      <section>
        <h2>Πρόοδος</h2>
        <ul id="found" class="found"></ul>
        <button id="reset" class="danger" type="button">Μηδένισε το κυνήγι</button>
      </section>

      <section>
        <h2>QR codes</h2>
        <p class="note">Τύπωσε από τη ζωντανή σελίδα (GitHub Pages), όχι από localhost.</p>
        <button id="print" type="button">Τύπωσε</button>
        <div id="qr-sheet" class="qr-sheet"></div>
      </section>
    </main>

    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
