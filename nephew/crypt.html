<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="app-root" content="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0708" />
    <title>Crypt</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚰️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin">
    <form id="pin-form" class="pin" hidden>
      <h1 class="title">Crypt</h1>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" />
      <button type="submit">Άνοιξε</button>
      <p id="pin-error" class="error" hidden>Λάθος PIN</p>
    </form>

    <main id="panel" class="panel" hidden>
      <header class="panel-head">
        <h1 class="title">Crypt · Ανιψιός</h1>
        <span id="score-now" class="mode"></span>
      </header>

      <section>
        <h2>Ζωντανά</h2>
        <p id="live-status" class="live-status"></p>
        <p id="live-question" class="live-question"></p>
        <ul id="live-answers" class="live-answers"></ul>
        <p id="live-votes" class="note"></p>
        <div class="row">
          <button id="primary" type="button" class="primary"></button>
          <button id="end-game" type="button" class="danger">🏁 Τέλος</button>
        </div>
      </section>

      <section>
        <h2>Νέο παιχνίδι</h2>
        <form id="new-game" class="row wrap">
          <label>Ερωτήσεις
            <select id="count">
              <option>5</option><option selected>10</option><option>15</option><option>20</option><option value="999">Όλες</option>
            </select>
          </label>
          <label>Δευτερόλεπτα
            <select id="seconds">
              <option>30</option><option>45</option><option selected>60</option><option>90</option>
            </select>
          </label>
          <button type="submit">🎲 Νέο παιχνίδι</button>
        </form>
        <p class="note">Τυχαίες ερωτήσεις, ανακατεμένες απαντήσεις. Οι παίκτες βλέπουν «Περιμένετε…» μέχρι να πατήσεις ▶.</p>
      </section>

      <div id="soundboard"></div>
    </main>

    <script type="module" src="/src/quiz/admin/main.ts"></script>
  </body>
</html>
